{% extends 'base.html' %}

{% block contenido %}

<h2>Pedidos</h2>

<a href="{{ url_for('pedidos.create') }}"
   class="btn btn-success mb-3">
    Nuevo Pedido
</a>

<table class="table table-bordered">

    <thead>
        <tr>
            <th>ID</th>
            <th>Fecha</th>
            <th>Cliente</th>
            <th>Producto</th>
            <th>Monto</th>
            <th>Acciones</th>
        </tr>
    </thead>

    <tbody>

        {% for pedido in pedidos %}

        <tr>

            <td>{{ pedido.id }}</td>

            <td>{{ pedido.fecha }}</td>

            <td>{{ pedido.cliente.nombre }}</td>

            <td>{{ pedido.producto.nombre }}</td>

            <td>{{ pedido.monto }}</td>

            <td>

                <a href="{{ url_for('pedidos.edit', id=pedido.id) }}"
                   class="btn btn-warning btn-sm">
                    Editar
                </a>

                <a href="{{ url_for('pedidos.delete', id=pedido.id) }}"
                   class="btn btn-danger btn-sm"
                   onclick="return confirm('¿Eliminar este pedido?')">
                    Eliminar
                </a>

            </td>

        </tr>

        {% endfor %}

    </tbody>

</table>

{% endblock %}
