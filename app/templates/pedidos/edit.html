{% extends 'base.html' %}

{% block contenido %}

<h2>Editar Pedido</h2>

<form method="POST">

    <div class="mb-3">

        <label>Cliente</label>

        <select
            name="cliente_id"
            class="form-control"
            required>

            {% for cliente in clientes %}

            <option
                value="{{ cliente.id }}"
                {% if cliente.id == pedido.cliente_id %}
                    selected
                {% endif %}
            >

                {{ cliente.nombre }}

            </option>

            {% endfor %}

        </select>

    </div>


    <div class="mb-3">

        <label>Producto</label>

        <select
            name="producto_id"
            class="form-control"
            required>

            {% for producto in productos %}

            <option
                value="{{ producto.id }}"
                {% if producto.id == pedido.producto_id %}
                    selected
                {% endif %}
            >

                {{ producto.nombre }}

            </option>

            {% endfor %}

        </select>

    </div>


    <div class="mb-3">

        <label>Monto</label>

        <input
            type="number"
            step="0.01"
            name="monto"
            class="form-control"
            value="{{ pedido.monto }}"
            required>

    </div>

    <button
        type="submit"
        class="btn btn-primary">

        Actualizar

    </button>

    <a href="{{ url_for('pedidos.index') }}"
       class="btn btn-secondary">

       Cancelar

    </a>

</form>

{% endblock %}
