{% extends 'base.html' %}

{% block contenido %}

<h2>Nuevo Pedido</h2>

<form method="POST">

    <div class="mb-3">

        <label>Cliente</label>

        <select
            name="cliente_id"
            class="form-control"
            required>

            <option value="">
                Seleccione un cliente
            </option>

            {% for cliente in clientes %}

            <option value="{{ cliente.id }}">
                {{ cliente.nombre }}
            </option>

            {% endfor %}

        </select>

    </div>


    <div class="mb-3">

        <label>Producto</label>

        <select
            name="producto_id"
            class="form-control"
            required>

            <option value="">
                Seleccione un producto
            </option>

            {% for producto in productos %}

            <option value="{{ producto.id }}">
                {{ producto.nombre }}
            </option>

            {% endfor %}

        </select>

    </div>


    <div class="mb-3">

        <label>Monto</label>

        <input
            type="number"
            step="0.01"
            name="monto"
            class="form-control"
            required>

    </div>

    <button
        type="submit"
        class="btn btn-primary">

        Guardar

    </button>

    <a href="{{ url_for('pedidos.index') }}"
       class="btn btn-secondary">

       Cancelar

    </a>

</form>

{% endblock %}
