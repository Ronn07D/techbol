{% extends 'base.html' %}

{% block contenido %}

<h2>Productos</h2>
<a href="/productos/create"
   class="btn btn-success mb-3">
    Nuevo Producto
</a>

<table class="table table-bordered">

    <thead>
        <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th>Precio</th>
            <th>Stock</th>
            <th>Acciones</th>
        </tr>
    </thead>

    <tbody>

        {% for producto in productos %}

        <tr>
            <td>{{ producto.id }}</td>
            <td>{{ producto.nombre }}</td>
            <td>{{ producto.precio }}</td>
            <td>{{ producto.stock }}</td>

            <td>

                <a href="{{ url_for('productos.edit', id=producto.id) }}"
                   class="btn btn-warning btn-sm">
                    Editar
                </a>

                <a href="{{ url_for('productos.delete', id=producto.id) }}"
                   class="btn btn-danger btn-sm"
                   onclick="return confirm('¿Eliminar este producto?')">
                    Eliminar
                </a>

            </td>

        </tr>

        {% endfor %}

    </tbody>

</table>

{% endblock %}
