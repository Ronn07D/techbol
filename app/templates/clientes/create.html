{% extends 'base.html' %}

{% block contenido %}

<h2>Nuevo Cliente</h2>

<form method="POST">

    <div class="mb-3">
        <label>Nombre</label>
        <input
            type="text"
            name="nombre"
            class="form-control"
            required>
    </div>

    <div class="mb-3">
        <label>Teléfono</label>
        <input
            type="text"
            name="telefono"
            class="form-control"
            required>
    </div>

    <button type="submit"
            class="btn btn-primary">
        Guardar
    </button>

    <a href="{{ url_for('clientes.index') }}"
       class="btn btn-secondary">
        Cancelar
    </a>

</form>

{% endblock %}
